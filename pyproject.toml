[project]
name = "mf-scorecard"
version = "0.1.0"
description = "SR 11-7 style multifamily PD rating scorecard built on Fannie Mae MFLPD data"
authors = [
    { name = "Matt Bledsoe", email = "mattbledsoe@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
docs = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyyaml>=6.0.3",
]
