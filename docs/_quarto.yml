project:
  type: book
  output-dir: _book

book:
  title: "Multifamily Rating Scorecard"
  subtitle: "A worked example of SR 11-7 model development"
  chapters:
    - index.qmd
    - data-exploration.qmd
    - modeling-data.qmd
    - methods.qmd
    - rating-scale.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-fold: true
    code-summary: "Show code"
    fig-format: png
    fig-dpi: 144

execute:
  echo: true
  warning: false

jupyter: python3
